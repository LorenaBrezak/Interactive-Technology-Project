<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="script.js" defer></script>
  <link rel="stylesheet" href="style.css">
  <title>Interactive Technology Project</title>
</head>

<body>

    <div class="page">
    
  <header class="site-header">
    <div class="header-content">
      <h1 class="site-title">Interactive Technology Project</h1>
      <span class="site-subtitle">UMAIA Course &mdash; 2025</span>
    </div>
  </header>

    <main>

         <!-- LEFT  FLEX BOX -->
        <div class="left-flex-box">
            <!-- Clapperboard -->
            <div id="asset-clapper" class="df-asset anchor-center" aria-label="Clapperboard">
                <img src="images/ClapperStick.svg" alt="Clapper Stick" id="clapper-open" class="clapper-img" tabindex="0" aria-label="Clapper Stick">
                <img src="images/ClapperSlate.svg" alt="Clapper Slate" id="clapper-closed" class="clapper-img" aria-hidden="true">
            </div>

            <!-- Movie Tape and Megaphone -->
            <div id="asset-movieTape-Megaphone" class="df-asset anchor-center" aria-label="Movie Tape and Megaphone">
                <div id="asset-MovieTape" class="tape-wrapper" aria-label="Movie Tape">
                <img class="tape-layer tape-main" src="movietape-assets/MovieTapeMain.svg" alt="Movie Tape Main">
                <img class="tape-layer tape-inner" data-frame="6" src="movietape-assets/InnerAsset 6.svg" alt="Movie Tape Inner 6">
                <img class="tape-layer tape-inner" data-frame="7" src="movietape-assets/InnerAsset 7.svg" alt="Movie Tape Inner 7">
                <img class="tape-layer tape-inner" data-frame="8" src="movietape-assets/InnerAsset 8.svg" alt="Movie Tape Inner 8">
                <img class="tape-layer tape-inner" data-frame="9" src="movietape-assets/InnerAsset 9.svg" alt="Movie Tape Inner 9">
                <img class="tape-layer tape-inner" data-frame="10" src="movietape-assets/InnerAsset 10.svg" alt="Movie Tape Inner 10">
                <img class="tape-layer tape-outer" data-frame="12" src="movietape-assets/OuterAsset 12.svg" alt="Movie Tape Outer 12">
                <img class="tape-layer tape-outer" data-frame="13" src="movietape-assets/OuterAsset 13.svg" alt="Movie Tape Outer 13">
                <img class="tape-layer tape-outer" data-frame="14" src="movietape-assets/OuterAsset 14.svg" alt="Movie Tape Outer 14">
                </div>

                <div id="asset-Megaphone" aria-label="Megaphone">
                <img class="megaphone-img" src="images/Megaphone.svg" alt="Megaphone">
                <img id="asset-Megaphone-Button" src="images/Button.svg" alt="Megaphone Button" tabindex="0">
                </div>

            </div>

        </div>

       

       
        <!-- MIDDLE FLEX BOX -->
        <div class="middle-flex-box">
            <!-- Label -->
            <div id="label-audiovisuals" class="df-label anchor-center" aria-hidden="false">
            <h1 id="audiovisuals-text">Audi<span class="wrapper">o<img src="images/Microphone.svg" id="asset-Mic" alt="MicLine"></span>visuals</h1>
            </div>

        </div>

        <!-- RIGHT FLEX BOX -->
        <div class="right-flex-box">
            <!-- Lamp -->
            <div id="asset-lamp" class="lamp-scene df-asset anchor-center">
            <img id="lamp-on" src="images/YellowLampOn.svg" alt="Lamp On" tabindex="0" class="lamp-img" style="display:block;">
            <img id="lamp-off" src="images/YellowLampOff.svg" alt="Lamp Off" tabindex="0" class="lamp-img" style="display:none;">
            </div>
        </div>
    
    </main>
  
  <footer class="site-footer">
    <div class="footer-content">
      <span class="footer-author">Made by: Lorena Brezak</span>
      <span class="footer-course">Interactive Technology Course UMAIA</span>
      <span class="footer-year">&copy; 2025</span>
    </div>
  </footer>

  </div>

</body>
</html>
